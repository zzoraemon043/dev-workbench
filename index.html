<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dev Workbench — the offline developer toolbox</title>
    <meta
      name="description"
      content="JSON, Regex, JWT, Diff, Codec pipelines and WebSocket debugging in one beautiful, 100% client-side tab. No backend, no tracking, works offline."
    />
    <meta name="theme-color" content="#f7f8fa" />
    <meta property="og:title" content="Dev Workbench" />
    <meta property="og:description" content="The offline-first developer toolbox. Paste anything — it figures out the rest." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('dev-workbench') || '{}').state?.theme ?? 'system'
        const dark = saved === 'dark' || (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
