name: 🐛 Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **never paste real tokens, secrets or private data** — use a redacted sample instead.
  - type: dropdown
    id: tool
    attributes:
      label: Affected tool
      options:
        - JSON Studio
        - Regex Lab
        - JWT Inspector
        - Diff Studio
        - Codec Pipeline
        - Socket Console
        - App shell (palette, shortcuts, theme, share links)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A share link (Alt+S) with redacted data is the fastest way for us to reproduce.
      placeholder: |
        1. Open Regex Lab
        2. Enter pattern …
        3. See …
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 141 on macOS 15
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Any errors from the browser devtools console.
      render: shell
